name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "Website/**"

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    name: Build unsigned IPA (macOS 26 + Xcode 26)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest installed Xcode 26
        run: |
          ls -d /Applications/Xcode*.app || true
          XCODE_APP=""
          for v in 26.9 26.8 26.7 26.6 26.5 26.4 26.3 26.2 26.1 26.0; do
            if [ -d "/Applications/Xcode_${v}.app" ]; then
              XCODE_APP="/Applications/Xcode_${v}.app"
              break
            fi
          done
          if [ -n "$XCODE_APP" ]; then
            echo "Selecting $XCODE_APP"
            sudo xcode-select -s "$XCODE_APP"
          else
            echo "No Xcode 26 dir found, using default Xcode"
          fi
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos || true

      - name: Build Hibiscus.app (no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project Hibiscus.xcodeproj \
            -target Hibiscus \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: Package unsigned IPA
        run: |
          APP_PATH=$(find build -type d -name "Hibiscus.app" -path "*Release-iphoneos*" | head -n 1)
          echo "Found app at: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Hibiscus.app not found in build products"
            find build -name "*.app" -maxdepth 6 || true
            exit 1
          fi
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry Hibiscus-unsigned.ipa Payload
          ls -lh Hibiscus-unsigned.ipa
          unzip -l Hibiscus-unsigned.ipa | head -20

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hibiscus-unsigned-ipa
          path: Hibiscus-unsigned.ipa
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
